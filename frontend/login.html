<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – UniAssist AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-uni">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-mortarboard-fill text-primary" style="font-size: 1.5rem;"></i>
                <span>UniAssist <span class="text-primary" style="color: var(--accent) !important;">AI</span></span>
            </a>
            <div class="d-flex align-items-center">
                <span class="text-muted small me-2">New student?</span>
                <a href="register.html" class="btn btn-outline-uni btn-sm">Create Account</a>
            </div>
        </div>
    </nav>

    <!-- Main Login Container -->
    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5">
                    <div class="uni-card shadow-md p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="mx-auto rounded-circle bg-light d-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px;">
                                <i class="bi bi-person-lock fs-2 text-primary"></i>
                            </div>
                            <h3 class="fw-bold mb-1">Student & Staff Sign In</h3>
                            <p class="text-secondary small">Access personalized AI chatbot support, timetables, and support tickets</p>
                        </div>

                        <!-- Alert Box -->
                        <div id="login-alert" class="alert d-none small" role="alert"></div>

                        <form id="login-form">
                            <div class="mb-3">
                                <label for="username" class="form-label small fw-semibold">University Email or Student ID</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0" id="username" placeholder="e.g. student@uniassist.edu or STU-2023-042" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="password" class="form-label small fw-semibold mb-0">Password</label>
                                    <a href="javascript:void(0)" onclick="API.showToast('Please contact IT Helpdesk (Room 102) or email it-support@university.edu to reset institutional credentials.', 'info')" class="small text-decoration-none" style="font-size: 0.8rem;">Forgot password?</a>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-shield-lock"></i></span>
                                    <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" placeholder="Enter password" required>
                                    <button class="btn btn-outline-secondary border-start-0 bg-white" type="button" id="toggle-password">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label small text-muted" for="rememberMe">Remember my login on this device</label>
                            </div>

                            <button type="submit" id="login-submit-btn" class="btn btn-primary-uni w-100 py-2 d-flex align-items-center justify-content-center gap-2">
                                <span>Sign In</span>
                                <i class="bi bi-arrow-right"></i>
                            </button>
                        </form>

                        <!-- Quick Demo Credentials Box -->
                        <div class="mt-4 pt-3 border-top">
                            <span class="text-muted small fw-semibold d-block mb-2 text-center">Quick Demo Accounts:</span>
                            <div class="d-flex gap-2">
                                <button type="button" class="btn btn-outline-uni btn-sm flex-fill d-flex align-items-center justify-content-center gap-1" id="fill-student-demo">
                                    <i class="bi bi-person-fill text-primary"></i> Student Demo
                                </button>
                                <button type="button" class="btn btn-outline-uni btn-sm flex-fill d-flex align-items-center justify-content-center gap-1" id="fill-admin-demo">
                                    <i class="bi bi-shield-lock-fill text-danger"></i> Admin Demo
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top py-3 text-center text-muted small">
        <div class="container">
            UniAssist AI Student Support System • Protected with BCrypt & JWT Security
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>

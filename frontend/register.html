<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration – UniAssist AI</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-uni">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-mortarboard-fill text-primary" style="font-size: 1.5rem;"></i>
                <span>UniAssist <span class="text-primary" style="color: var(--accent) !important;">AI</span></span>
            </a>
            <div class="d-flex align-items-center">
                <span class="text-muted small me-2">Already registered?</span>
                <a href="login.html" class="btn btn-outline-uni btn-sm">Sign In</a>
            </div>
        </div>
    </nav>

    <!-- Main Registration Container -->
    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8 col-xl-7">
                    <div class="uni-card shadow-md p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="mx-auto rounded-circle bg-light d-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px;">
                                <i class="bi bi-person-plus-fill fs-2 text-primary"></i>
                            </div>
                            <h3 class="fw-bold mb-1">Student Account Registration</h3>
                            <p class="text-secondary small">Enroll with your university credentials to receive personalized chatbot assistance</p>
                        </div>

                        <!-- Alert Message Box -->
                        <div id="register-alert" class="alert d-none small" role="alert"></div>

                        <form id="register-form" novalidate>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="fullName" class="form-label small fw-semibold">Full Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="fullName" placeholder="e.g. Aarav Sharma" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="studentId" class="form-label small fw-semibold">Student / Enrollment Number <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="studentId" placeholder="e.g. STU-2024-CSE012" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="email" class="form-label small fw-semibold">University Email Address <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="email" placeholder="student@uniassist.edu" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="mobileNumber" class="form-label small fw-semibold">Mobile Number</label>
                                    <input type="tel" class="form-control" id="mobileNumber" placeholder="+91 9876543210">
                                </div>

                                <div class="col-md-5">
                                    <label for="department" class="form-label small fw-semibold">Department <span class="text-danger">*</span></label>
                                    <select class="form-select" id="department" required>
                                        <option value="">Select Department</option>
                                        <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                                        <option value="Information Technology">Information Technology</option>
                                        <option value="Electronics & Communication">Electronics & Communication</option>
                                        <option value="Mechanical Engineering">Mechanical Engineering</option>
                                        <option value="Management Studies">Management Studies</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="course" class="form-label small fw-semibold">Degree Program <span class="text-danger">*</span></label>
                                    <select class="form-select" id="course" required>
                                        <option value="">Select Degree</option>
                                        <option value="B.Tech">B.Tech</option>
                                        <option value="MCA">MCA</option>
                                        <option value="MBA">MBA</option>
                                        <option value="BCA">BCA</option>
                                        <option value="M.Tech">M.Tech</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label for="semester" class="form-label small fw-semibold">Current Sem <span class="text-danger">*</span></label>
                                    <select class="form-select" id="semester" required>
                                        <option value="1">Sem 1</option>
                                        <option value="2">Sem 2</option>
                                        <option value="3">Sem 3</option>
                                        <option value="4" selected>Sem 4</option>
                                        <option value="5">Sem 5</option>
                                        <option value="6">Sem 6</option>
                                        <option value="7">Sem 7</option>
                                        <option value="8">Sem 8</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="password" class="form-label small fw-semibold">Password <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="password" placeholder="Min 6 characters" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="confirmPassword" class="form-label small fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password" required>
                                </div>
                            </div>

                            <div class="mt-4 form-check">
                                <input type="checkbox" class="form-check-input" id="termsCheck" required>
                                <label class="form-check-label small text-muted" for="termsCheck">
                                    I agree to the university IT acceptable usage policy and privacy terms.
                                </label>
                            </div>

                            <button type="submit" id="register-submit-btn" class="btn btn-primary-uni w-100 py-2 mt-4 d-flex align-items-center justify-content-center gap-2">
                                <span>Create Student Account</span>
                                <i class="bi bi-check-circle-fill"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-top py-3 text-center text-muted small">
        <div class="container">
            UniAssist AI • Secure Student Verification • Passwords hashed via BCrypt
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
